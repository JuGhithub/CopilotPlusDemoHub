name: CI - Build, Tests & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Restore dependencies
      run: dotnet restore CopilotPlusDemoHub.sln

    - name: Audit NuGet Vulnerabilities
      run: dotnet list package --vulnerable --include-transitive
      continue-on-error: true

    - name: Build Solution (.NET 8 WPF & Tests)
      run: dotnet build CopilotPlusDemoHub.sln -c Release --no-restore

    - name: Run .NET Unit Tests (xUnit)
      run: dotnet test DemoHub.Tests/DemoHub.Tests.csproj -c Release --no-build --verbosity normal

    - name: Install Python Test Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest numpy pymupdf pillow opencv-python-headless soundfile

    - name: Run Python Service Tests (pytest)
      run: pytest tests/ -v

    - name: Run Dependency Security Audit (pip-audit)
      run: |
        python -m pip install pip-audit
        python -m pip_audit -r requirements.lock --desc on
      continue-on-error: true

    - name: Run PowerShell Script Analysis (PSScriptAnalyzer)
      shell: pwsh
      run: |
        Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
        Invoke-ScriptAnalyzer -Path ./ -Recurse -Severity Error,Warning
      continue-on-error: true

    - name: Upload SBOM SPDX Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spdx-sbom
        path: SBOM.spdx.json
        if-no-files-found: warn
